{% load static %}

<!DOCTYPE html>
<html :class="{ 'theme-white': white }" x-data="data()" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'windmill/assets/css/tailwind.output.css' %}" />
    <script
      src="https://cdn.jsdelivr.net/gh/alpinejs/alpine@v2.x.x/dist/alpine.min.js"
      defer
    ></script>
    <script src="{% static 'windmill/assets/js/init-alpine.js' %}"></script>
  </head>
  <body>
    <div class="flex items-center min-h-screen p-6 bg-gradient-to-r from-purple-300 via-pink-300 to-blue-300 dark:bg-gradient-to-r dark:from-gray-800 dark:via-gray-900 dark:to-black">

      <div class="flex-1 h-full max-w-4xl mx-auto overflow-hidden bg-white rounded-lg shadow-xl dark:bg-gray-800">
        <div class="flex flex-col overflow-y-auto md:flex-row">
          <div class="h-40 md:h-auto md:w-1/2 flex justify-center items-center">
            <img
              aria-hidden="true"
              class="object-cover w-[300px] h-[300px] dark:hidden"
              src="{% static 'bg/1.jpg' %}"
              alt="Office"
            />
        
            <img
              aria-hidden="true"
              class="hidden object-cover w-full h-full dark:block"
              src="{% static 'windmill/assets/img/login-side.jpg' %}"
              alt="Office"
            />
          </div>
          
          <div class="flex items-center justify-center p-6 sm:p-12 md:w-1/2">
            <div class="w-full">
              <h1 class="mb-4 text-xl font-semibold text-gray-700 dark:text-gray-200">Login</h1>

            

              <form id="login-form" method="post" action="{% url 'core:login' %}">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">

                <label for="username" class="block text-sm">
                    <span class="text-gray-700 dark:text-gray-400">Username</span>
                    <input
                        class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                        placeholder="Username"
                        id="username"
                        name="username"
                        required
                    />
                </label>

                <label for="password" class="block mt-4 text-sm">
                  <span class="text-gray-700 dark:text-gray-400">Password</span>
                  <input
                      class="block w-full mt-1 text-sm dark:border-gray-600 dark:bg-gray-700 focus:border-purple-400 focus:outline-none focus:shadow-outline-purple dark:text-gray-300 dark:focus:shadow-outline-gray form-input"
                      placeholder="********"
                      type="password"
                      id="password"
                      name="password"
                      required
                  />
              </label>
              <button
              class="block w-full px-4 py-2 mt-4 text-sm font-medium leading-5 text-center text-white transition-colors duration-150 bg-purple-600 border border-transparent rounded-lg active:bg-purple-600 hover:bg-purple-700 focus:outline-none focus:shadow-outline-purple"
              type="submit"
            >
              Log in
            </button>
              </form>
<!-- Display Error Message -->
{% if messages %}
  <div class="alert alert-danger bg-red-500 text-black p-1 rounded mb-2">
    {% for message in messages %}
      <p class="text-sm">{{ message }}</p>
    {% endfor %}
  </div>
{% endif %}
              <hr class="my-8" />

              <p class="mt-4">
               {% comment %} <a href="{% url 'core:forgot_password' %}">
  Forgot your password?
</a> {% endcomment %}

              </p>
              <p class="mt-1">
                <a
                  class="text-sm font-medium text-purple-600 dark:text-purple-400 hover:underline"
                  href="{% url 'core:resident_registration'%}"
                >
                  Create account

                </a>
              </p>
              <p class="mt-1">
                <a
                class="inline-flex items-center text-sm font-medium text-purple-600 dark:text-purple-400 hover:underline"
                href="{% url 'core:landing' %}"
              >
                <!-- Left Arrow Icon -->
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                  xmlns="http://www.w3.org/2000/svg">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                </svg>
                Back
              </a>
              
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
