{% block content %}
<div class="max-w-md mx-auto p-6 bg-white shadow-md rounded">
    <h2 class="text-2xl font-bold mb-4 text-center">Forgot Password</h2>
    <form method="POST">
        {% csrf_token %}
        <label class="block mb-2 text-sm font-medium text-gray-700">Enter your email</label>
        {{ form.email }}
        <button type="submit"
                class="w-full mt-4 bg-purple-600 text-white py-2 px-4 rounded hover:bg-purple-700">
            Send Reset Link
        </button>
    </form>
</div>
{% endblock %}
