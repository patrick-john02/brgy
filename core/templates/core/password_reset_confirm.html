
{% block content %}
<div class="max-w-md mx-auto p-6 bg-white shadow-md rounded">
    <h2 class="text-2xl font-bold mb-4 text-center">Set New Password</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"
                class="w-full mt-4 bg-purple-600 text-white py-2 px-4 rounded hover:bg-purple-700">
            Change Password
        </button>
    </form>
</div>
{% endblock %}
