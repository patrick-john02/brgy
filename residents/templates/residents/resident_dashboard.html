{% extends "residents/includes/base.html" %}
{% block content %}
{% load static %}

<div class="container-fluid">
    <div class="row page-titles mx-0">
        <div class="col-sm-6 p-md-0">
            <div class="welcome-text">
                <h4>Hi, welcome back! {{user.username}} </h4>
               
            </div>
        </div>
        <div class="col-sm-6 p-md-0 justify-content-sm-end mt-2 mt-sm-0 d-flex">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'residents:dashboard'%}">Dashboard</a></li>
                
            </ol>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-3 col-sm-6">
            <div class="card">
                <div class="stat-widget-one card-body">
                    <div class="stat-icon d-inline-block">
                        <i class="ti-package text-primary border-primary me-2"></i> 
                    </div>
                    <div class="stat-content d-inline-block">
                        <div class="stat-text">Inventory</div>
                        <div class="stat-digit">1,012</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-3 col-sm-6">
            <div class="card">
                <div class="stat-widget-one card-body">
                    <div class="stat-icon d-inline-block">
                        <i class="ti-files text-warning border-warning me-2"></i>
                    </div>
                    <div class="stat-content d-inline-block">
                        <div class="stat-text">Pending</div>
                        <div class="stat-digit">961</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-3 col-sm-6">
            <div class="card">
                <div class="stat-widget-one card-body">
                    <div class="stat-icon d-inline-block">
                        <i class="ti-check-box text-success border-success me-2"></i>
                    </div>
                    <div class="stat-content d-inline-block">
                        <div class="stat-text">Approved</div>
                        <div class="stat-digit">770</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-3 col-sm-6">
            <div class="card">
                <div class="stat-widget-one card-body">
                    <div class="stat-icon d-inline-block">
                        <i class="ti-alert text-danger border-danger me-2"></i>
                    </div>
                    <div class="stat-content d-inline-block">
                        <div class="stat-text">Reports</div>
                        <div class="stat-digit">2,781</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-xl-12 col-lg-8 col-md-8">
            <div class="card">
                {% comment %} <div class="card-header">
                    <h4 class="card-title">Residents in Natappian East</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-xl-12 col-lg-8">
                            <div id="morris-bar-chart"></div>
                        </div>
                    </div>
                </div> {% endcomment %}
            </div>
        </div>
       
    </div>
</div>
</div>
{% endblock %}
